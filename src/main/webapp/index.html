<!DOCTYPE html>
<html>
<head>
    <title>Expense & Food Tracker - v2</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            cursor: pointer;
            background: #333;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background: #555;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Expense & Food Tracker</h1>

    <h2>Add Expense</h2>

    <!-- Send form data to Java Servlet -->
    <form action="addExpense" method="post">

        <label for="category">Category</label>

        <select id="category" name="category">
            <option value="Food">Food</option>
            <option value="Grocery">Grocery</option>
            <option value="Travel">Travel</option>
            <option value="Other">Other</option>
        </select>

        <label for="amount">Amount (₹)</label>

        <input
            type="number"
            id="amount"
            name="amount"
            placeholder="Enter amount"
            step="0.01"
            required
        >

        <label for="date">Date</label>

        <input
            type="date"
            id="date"
            name="date"
            required
        >

        <label for="description">Description</label>

        <input
            type="text"
            id="description"
            name="description"
            placeholder="Example: Lunch"
            required
        >

        <button type="submit">
            Add Expense
        </button>

    </form>

</div>

</body>
</html>
